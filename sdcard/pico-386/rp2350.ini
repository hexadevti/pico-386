; rp2350.ini -- only for the Pico 2 (RP2350) build, read once at power-on.
; Everything is commented out, so nothing changes. If your PicoCalc freezes at random, try the
; lines below one at a time: remove the ';' in front, save, and switch the PicoCalc off and on.
; The serial log (USB-C, 115200) shows what was applied in a line starting "rp2350.ini:".
[rp2350]

; The CPU clock in MHz, 100-300. 300 is the default and the fastest; lower is slower but steadier.
;mhz = 250

; The RP2350's core voltage in volts, 1.10-1.30. 1.10 is the default. A little more voltage lets
; some chips run 300 MHz without freezing, and costs a few mA.
;vreg = 1.20

; The PSRAM's clock divider, 2-10: 2 is the default and the fastest, 3 gives the RAM more margin.
;psram_div = 3
